sonar.projectKey=rag-hub-mcp
sonar.projectName=rag-hub-mcp

sonar.sources=src
sonar.exclusions=src/**/*.test.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.lcov.reportPaths=dist/coverage/lcov.info

# All generated artifacts live under dist/ so a single entry in .gitignore covers them.
sonar.working.directory=dist/.scannerwork

# Align with vitest.config.ts, which excludes the server bootstrap and logger
# from coverage (pure glue code, not unit-tested).
sonar.coverage.exclusions=src/index.ts,src/log.ts
